name: Current Strategy Replay (Research)

# Diagnostic/research-only workflow. No runtime trading behavior change.

on:
  push:
    branches: [fix/scalp-runtime-diagnostics]
    paths:
      - 'analytics/current_strategy_replay.py'
      - 'analytics/fetch_current_strategy_dataset.py'
      - 'dual_mode_strategy.py'
      - 'multi_timeframe_context.py'
      - 'multi_candle_context.py'
      - '.github/workflows/current-strategy-replay.yml'
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fetch research dataset
        run: >-
          python analytics/fetch_current_strategy_dataset.py
          BTCUSDT ETHUSDT BNBUSDT SOLUSDT ADAUSDT FETUSDT
          --candles-5m 10000
      - name: Replay current strategy
        run: >-
          python analytics/current_strategy_replay.py
          BTCUSDT ETHUSDT BNBUSDT SOLUSDT ADAUSDT FETUSDT
      - name: Upload replay result
        uses: actions/upload-artifact@v4
        with:
          name: current-strategy-replay
          path: research_database/current_strategy_replay.csv
          if-no-files-found: error
