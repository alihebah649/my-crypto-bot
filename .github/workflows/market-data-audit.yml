name: Market Data Audit

on:
  push:
    branches:
      - audit/market-data-centralization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  market-data-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run market-data cache flow tests
        run: python -m pytest -q tests/test_market_data_cache_flow.py tests/test_market_data_three_wave_scheduler.py
