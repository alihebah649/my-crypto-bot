name: Paper Execution Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "pipeline/**"
      - "shadow_main.py"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  paper-execution-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show tested commit
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run paper integration tests
        run: python -m pytest -q pipeline/test_paper_trading.py pipeline/test_integration.py
