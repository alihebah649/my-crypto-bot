name: Paper Execution Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "trade_manager/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  paper-execution-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show tested commit
        run: |
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run Paper Execution tests
        run: python -m pytest -q tests/test_paper_execution.py

      - name: Run Trade Manager integration contract tests
        run: python -m pytest -q tests/test_trade_manager_contract.py tests/test_core_execution_bridge.py
