name: Paper Execution Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tm-integration-work
    paths:
      - "core/**"
      - "trade_manager/**"
      - "tests/**"
      - "shadow_main.py"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  paper-execution-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Show tested commit
        run: |
          echo "Testing ref: ${{ github.ref }}"
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run isolated Paper Execution tests
        run: python -m pytest -q tests/test_paper_execution.py

      - name: Run Trade Manager Part 6/7 contract tests
        run: python -m pytest -q tests/test_trade_manager_parts67.py

      - name: Run Trade Manager integration tests
        run: python -m pytest -q tests/test_trade_manager_integration.py

      - name: Run Trade Manager paper end-to-end tests
        run: python -m pytest -q tests/test_trade_manager_paper_e2e.py

      - name: Run Part 6 application composition tests
        run: python -m pytest -q tests/test_trade_manager_part6_composition.py

      - name: Run Shadow Main Trade Manager lifecycle tests
        run: python -m pytest -q tests/test_shadow_trade_manager_runtime.py

      - name: Run full Python regression suite
        run: python -m pytest -q
