name: Breakout Gate Walk-Forward (Research)

on:
  push:
    branches: [fix/scalp-runtime-diagnostics]
    paths:
      - 'analytics/current_strategy_replay.py'
      - 'analytics/fetch_current_strategy_dataset.py'
      - 'analytics/walk_forward_breakout_gate.py'
      - '.github/workflows/breakout-gate-walk-forward.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch long research datasets
        run: >-
          python analytics/fetch_current_strategy_dataset.py
          BTCUSDT ETHUSDT BNBUSDT SOLUSDT ADAUSDT FETUSDT
          --candles-5m 20000
          --data-dir data_warehouse
      - name: Run current strategy replay
        run: >-
          python analytics/current_strategy_replay.py
          --data-dir data_warehouse
          --symbols BTCUSDT ETHUSDT BNBUSDT SOLUSDT ADAUSDT FETUSDT
          --output research_database/current_strategy_replay.csv
      - name: Validate breakout gate walk-forward
        run: >-
          python analytics/walk_forward_breakout_gate.py
          research_database/current_strategy_replay.csv
          --folds 4
          --test-fraction 0.25
      - name: Upload walk-forward research
        uses: actions/upload-artifact@v4
        with:
          name: breakout-gate-walk-forward
          path: research_database/breakout_gate_walk_forward.csv
