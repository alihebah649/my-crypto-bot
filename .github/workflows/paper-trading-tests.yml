name: Paper Trading Tests

on:
  push:
    branches:
      - main
      - tm-integration-work
      - tm-state-continuity
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run Trade Manager Paper tests
        run: |
          python -m pytest -q \
            tests/test_trade_manager_paper_final_path.py \
            tests/test_trade_manager_restart_continuity.py
