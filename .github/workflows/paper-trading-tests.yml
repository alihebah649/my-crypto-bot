name: Paper Trading Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tm-integration-work
      - tm-state-continuity
      - feature/reconciliation-gate-final
    paths:
      - "core/**"
      - "trade_manager/**"
      - "tests/**"
      - "shadow_main.py"
      - "requirements.txt"
      - ".github/workflows/paper-trading-tests.yml"
  pull_request:
    paths:
      - "core/**"
      - "trade_manager/**"
      - "tests/**"
      - "shadow_main.py"
      - "requirements.txt"
      - ".github/workflows/paper-trading-tests.yml"

permissions:
  contents: read

jobs:
  paper-trading-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Show tested commit
        run: |
          echo "Testing ref: ${{ github.ref }}"
          echo "Testing commit: $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run Paper Trading lifecycle tests
        run: python -m pytest -q tests/test_trade_manager_paper_final_path.py

      - name: Run Paper Trading restart/state continuity tests
        run: python -m pytest -q tests/test_paper_restart_continuity.py

      - name: Run reward-risk profit floor regression tests
        run: python -m pytest -q tests/test_reward_risk_profit_floor.py

      - name: Run Paper execution safety tests
        run: python -m pytest -q tests/test_paper_safety_guards.py tests/test_paper_market_data_safety.py

      - name: Run full Python regression suite
        run: python -m pytest -q
