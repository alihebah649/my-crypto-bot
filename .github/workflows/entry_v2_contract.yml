name: Entry v2 Contract

on:
  push:
    branches:
      - entry-v2-contract-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -r requirements.txt

      - name: Run Entry v2 contract, target/RR, replay, capture, and runtime wiring tests
        run: >-
          python -m pytest -q
          tests/test_entry_engine_v2_contract.py
          tests/test_entry_v2_swing_lane.py
          tests/test_entry_v2_legacy_adapter.py
          tests/test_entry_v2_target_rr.py
          tests/test_entry_target_rr_tiebreak.py
          tests/test_entry_v2_target_gate.py
          tests/test_entry_v2_replay.py
          tests/test_entry_v2_capture.py
          tests/test_entry_v2_runtime_capture.py
          tests/test_entry_v2_runtime_persistence.py
          tests/test_entry_v2_candidate_binding.py
          tests/test_entry_v2_outcome_analysis.py
          tests/test_entry_v2_shadow_report.py
          tests/test_paper_runtime_mtf_wiring.py
