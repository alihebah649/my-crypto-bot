name: Breakout A/B Replay (Research)

# Research-only. Does not change runtime trading behavior.
on:
  push:
    branches: [fix/scalp-runtime-diagnostics]
    paths:
      - 'analytics/breakout_ab_replay.py'
      - 'analytics/regime_entry_replay.py'
      - 'analytics/fetch_current_strategy_dataset.py'
      - 'dual_mode_strategy.py'
      - 'multi_timeframe_context.py'
      - 'multi_candle_context.py'
      - '.github/workflows/breakout-ab-replay.yml'
  workflow_dispatch:

jobs:
  breakout-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prepare research directory
        run: mkdir -p research_database
      - name: Fetch research datasets
        run: >-
          python analytics/fetch_current_strategy_dataset.py
          BTCUSDT ETHUSDT BNBUSDT SOLUSDT ADAUSDT FETUSDT
          --candles-5m 1200
      - name: Run exact A/B replay
        run: python analytics/breakout_ab_replay.py
      - name: Upload A/B result
        uses: actions/upload-artifact@v4
        with:
          name: breakout-ab-replay
          path: research_database/breakout_ab_replay.csv
          if-no-files-found: error
