name: Trading Bot

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python bot.py
      - name: Commit data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data.json
          git commit -m "Update data" || echo "No changes"
          git push
